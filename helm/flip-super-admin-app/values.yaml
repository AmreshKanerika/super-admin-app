namespace: flip-dev

replicaCount: 1

image:
  repository: flipdocker-hydaahceftbdafbn.azurecr.io/flip-super-admin-app
  tag: latest-release
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80

containerPort: 80

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

readinessProbe:
  path: /
  initialDelaySeconds: 5
  periodSeconds: 10

livenessProbe:
  path: /
  initialDelaySeconds: 15
  periodSeconds: 20

ingress:
  enabled: false
  host: aks.kanerika.cloud
  path: /
