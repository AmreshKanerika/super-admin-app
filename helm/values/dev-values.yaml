# -----------------------------------------------------------------------------
# DEV overrides — layered on top of helm/flip-super-admin-app/values.yaml via `helm -f`.
#
# Target: namespace `flip-dev` on cluster `aks-flip-dev-sit`, pinned to the `flipdev`
# node pool (label env=dev) — same as flip-ui. Built with `npm run build:dev`.
#
# The ingress stays off until a DEV host and certificate are agreed; turn it on with
#   ingress.enabled: true, ingress.host: <host>, ingress.tlsSecretName: <secret in flip-dev>
# -----------------------------------------------------------------------------
namespace: flip-dev

nodeSelector:
  env: dev

tolerations:
  - key: env
    operator: Equal
    value: dev
    effect: NoSchedule
