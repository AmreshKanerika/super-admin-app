# FLIP Platform console login theme for the flip-super-admin realm.
# Extends Keycloak's own keycloak.v2 login theme, so every page (sign in, update password,
# forgot password, verify email, errors) keeps Keycloak's templates and only the look changes.
parent=keycloak.v2
import=common/keycloak

# Keep keycloak.v2's stylesheet and layer the FLIP one on top.
styles=css/styles.css css/flip.css

favIcon=/img/favicon.ico
