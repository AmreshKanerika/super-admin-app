<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" fill="none" role="img" aria-label="Animated connected FLIP platform">
<defs>
  <linearGradient id="surface" x1="330" y1="100" x2="570" y2="340" gradientUnits="userSpaceOnUse"><stop stop-color="#fff"/><stop offset=".55" stop-color="#f9f1ff"/><stop offset="1" stop-color="#dcc4ef"/></linearGradient>
  <linearGradient id="edge" x1="340" y1="250" x2="570" y2="320" gradientUnits="userSpaceOnUse"><stop stop-color="#cba2e5"/><stop offset=".5" stop-color="#a56ccf"/><stop offset="1" stop-color="#e8cbdf"/></linearGradient>
  <linearGradient id="ribbon" x1="170" y1="150" x2="740" y2="300" gradientUnits="userSpaceOnUse"><stop stop-color="#d5b3e9" stop-opacity=".25"/><stop offset=".4" stop-color="#a172c5" stop-opacity=".75"/><stop offset=".7" stop-color="#dda0bd"/><stop offset="1" stop-color="#e9cbb9" stop-opacity=".3"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#d3afea" stop-opacity=".6"/><stop offset="1" stop-color="#dabded" stop-opacity="0"/></radialGradient>
  <filter id="shadow" x="-50%" y="-50%" width="200%" height="220%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#9363b4" flood-opacity=".24"/></filter>
  <filter id="light"><feGaussianBlur stdDeviation="4"/></filter>
  <style>
    .platform { animation:float 7s ease-in-out infinite; transform-origin:450px 210px; }
    .ring { transform-origin:450px 220px; animation:orbit 32s linear infinite; }
    .track { stroke-dasharray:3 13; animation:track 12s linear infinite; }
    .satellite { animation:float 6s ease-in-out infinite; }.delayed { animation-delay:-3s; }
    .pulse { transform-origin:450px 220px; animation:pulse 5s ease-in-out infinite; }
    @keyframes float { 50% { transform:translateY(-10px); } }
    @keyframes orbit { to { transform:rotate(360deg); } }
    @keyframes track { to { stroke-dashoffset:-192; } }
    @keyframes pulse { 50% { transform:scale(1.08); opacity:.5; } }
    @media(prefers-reduced-motion:reduce) { .platform,.ring,.track,.satellite,.pulse { animation:none; }.packet { display:none; } }
  </style>
</defs>
<ellipse class="pulse" cx="450" cy="240" rx="265" ry="175" fill="url(#halo)"/>
<ellipse cx="450" cy="342" rx="134" ry="19" fill="#b497cb" opacity=".12" filter="url(#light)"/>
