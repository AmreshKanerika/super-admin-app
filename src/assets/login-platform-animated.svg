<ellipse cx="450" cy="228" rx="263" ry="94" transform="rotate(-16 450 228)" stroke="url(#ribbon)" stroke-width="17" opacity=".75"/>
<ellipse cx="450" cy="228" rx="274" ry="106" transform="rotate(-16 450 228)" stroke="#fff" stroke-width="1.5" opacity=".8"/>
<g class="ring" stroke="#bea0d3" opacity=".35"><circle cx="450" cy="220" r="172" stroke-dasharray="1 15"/><circle cx="450" cy="48" r="5" fill="#d1b5e4" stroke="#fff"/></g>
<g transform="translate(-67.5 -33) scale(1.15)"><g class="platform" filter="url(#shadow)">
  <path d="M450 170L574 241V275L450 346L326 275V241Z" fill="url(#edge)" opacity=".5"/>
  <path d="M450 165L574 237L450 309L326 237Z" fill="#f9f1ff" stroke="#fff" stroke-width="1.5"/>
  <path d="M450 129L562 194V245L450 310L338 245V194Z" fill="url(#edge)"/>
