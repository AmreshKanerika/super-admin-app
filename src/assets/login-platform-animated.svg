  <path d="M450 259V310M338 194L450 259L562 194" stroke="#fff" stroke-opacity=".7" stroke-width="1.5"/>
  <rect x="372" y="140" width="156" height="110" rx="25" fill="url(#surface)" stroke="#fff" stroke-width="2"/>
  <image x="393" y="160" width="114" height="49" href="data:image/svg+xml;base64,"/>
  <g fill="#bba0ca"><circle cx="438" cy="226" r="2"/><circle cx="450" cy="226" r="2"/><circle cx="462" cy="226" r="2"/></g>
</g>
</g><g class="satellite" filter="url(#shadow)"><rect x="212" y="59" width="49" height="49" rx="13" transform="rotate(-15 236 83)" fill="#f8f0fd" stroke="#fff"/><path d="M225 87V77h22v10M230 77v-7h12v7M230 82h3m6 0h3" stroke="#b48acf" stroke-width="2" stroke-linecap="round"/></g>
<g class="satellite delayed" filter="url(#shadow)"><rect x="650" y="262" width="51" height="51" rx="14" transform="rotate(15 675 287)" fill="#faedf0" stroke="#fff"/><path d="M664 286l8-6 7 4 10-11M664 295v-15" stroke="#cb98b0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<circle cx="636" cy="86" r="10" fill="#e9c6c3" stroke="#fff" stroke-width="2"/>
<circle cx="300" cy="325" r="6" fill="#d8bee9" stroke="#fff" stroke-width="2"/>
<circle class="packet" r="4" fill="#ad7bc8"><animateMotion dur="5s" repeatCount="indefinite" path="M150 120C275 120 265 210 388 215"/></circle>
<circle class="packet" r="4" fill="#cb97b8"><animateMotion dur="6s" repeatCount="indefinite" path="M510 215C638 209 630 140 745 140"/></circle>
<circle class="packet" r="4" fill="#ad7bc8"><animateMotion dur="7s" repeatCount="indefinite" path="M188 340C275 340 280 252 392 242"/></circle>
<circle class="packet" r="4" fill="#cb97b8"><animateMotion dur="5.5s" repeatCount="indefinite" path="M510 242C626 250 628 342 735 342"/></circle>
</svg>
