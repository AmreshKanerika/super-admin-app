server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: every route falls back to index.html (Angular client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache fingerprinted static assets
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|ttf|svg|map)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
    }
}
