server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # The gateway reads the Referer header to know which site a request came from, so keep the
    # browser default (strict-origin-when-cross-origin) rather than stripping it.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Liveness / readiness probe for load balancers and Kubernetes.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Runtime configuration, written at container start-up — never cache it.
    location = /env.js {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # The shell page must always be fresh so a new release is picked up straight away.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # SPA: every route falls back to index.html (Angular client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Images, logos and help screenshots keep their names between releases, so cache them briefly.
    location ^~ /assets/ {
        expires 1d;
        access_log off;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Bundles carry a content hash in their file name, so they can be cached for a year.
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|woff2?|ttf|svg|map)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
